name: ci

on:
  push:
  pull_request:
    # labeled/unlabeled: the `breaking-accepted` label changes the oasdiff and check_error_spec_stable verdicts.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  BUF_VERSION: 1.47.2

jobs:
  openapi-lint:
    name: OpenAPI lint (Redocly)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Config: redocly.yaml in the repo root.
      - run: npx --yes @redocly/cli@1 lint openapi/openapi.yaml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install 'pyyaml>=6,<7'
      - name: POST idempotency declarations and regression tests
        run: |
          python3 scripts/check_idempotency.py openapi/openapi.yaml
          python3 -m unittest discover -s scripts -p 'test_idempotency.py'

  openapi-breaking:
    name: OpenAPI breaking changes (oasdiff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: 'origin/${{ github.base_ref }}:openapi/openapi.yaml'
          revision: 'HEAD:openapi/openapi.yaml'
          # The owner accepts a breaking change of the alpha with the `breaking-accepted` label on that PR
          # (api.md, «Удаление устаревшего»): the changes are still listed, the job does not fail.
          fail-on: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-accepted') && 'ERR' || '' }}

  proto:
    name: Protobuf lint and breaking changes (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # buf lint on every run; buf breaking against the PR base on pull requests.
      # format/push are off: sources are kept as is, nothing is pushed to BSR (deps of proto/buf.lock are read from it).
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          input: proto
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: '${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto'
          push: false
          archive: false
          pr_comment: false

  error-registry:
    name: Error registry vs docs/api.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install 'protobuf>=5,<8'
      # The script expects descriptors (with imports) and the path to api.md.
      - name: Build descriptors
        working-directory: proto
        run: buf build -o "$RUNNER_TEMP/fd.binpb"
      - name: Check registry
        working-directory: proto
        run: python3 scripts/check_error_registry.py "$RUNNER_TEMP/fd.binpb" ../docs/api.md
      # error_spec of existing codes must not change (grpc-api.md 5.1, rule 5): buf breaking does not compare
      # custom options. The owner accepts a change with the `breaking-accepted` label.
      - name: Build base descriptors
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf build '${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto' -o "$RUNNER_TEMP/base.binpb"
      - name: error_spec of existing codes is unchanged
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: >-
          python3 scripts/check_error_spec_stable.py "$RUNNER_TEMP/base.binpb" "$RUNNER_TEMP/fd.binpb"
          ${{ contains(github.event.pull_request.labels.*.name, 'breaking-accepted') && '--accepted' || '' }}

  go-module:
    name: Go module gen/go (generation, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: gen/go/go.mod
          cache-dependency-path: |
            tools/go.sum
            gen/go/go.sum
      # buf is pinned in tools/go.mod; BUF_VERSION above (buf-action) must be the same version.
      - name: buf version is the same in tools/go.mod and BUF_VERSION
        working-directory: tools
        run: test "$(go list -m -f '{{.Version}}' github.com/bufbuild/buf)" = "v${BUF_VERSION}"
      - name: Vet the generator
        working-directory: tools
        run: go vet ./...
      # gen/go must be exactly what proto/ generates with the pinned plugins.
      - name: Regenerate
        run: scripts/generate.sh
      - name: gen/go matches proto/
        run: |
          if [ -n "$(git status --porcelain -- gen/go)" ]; then
            git status --porcelain -- gen/go
            git diff -- gen/go | head -200
            echo "::error::gen/go is out of date: run scripts/generate.sh and commit the result"
            exit 1
          fi
      - name: Build, vet and test
        working-directory: gen/go
        run: |
          go build ./...
          go vet ./...
          go test -race -count=1 -coverpkg=./... -coverprofile=cover.out ./...


      - name: Test the generator with coverage
        working-directory: tools
        run: go test -race -count=1 -coverpkg=./... -coverprofile=cover.out ./...
      - name: Test the coverage report
        run: python3 -m unittest discover -s scripts -p 'test_coverage_diff.py'

      # Informational coverage report; this repository has no changed-line percentage gate.
      # The branch name goes through env.
      - name: Project and changed-line coverage
        id: coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          rm -f coverage.md
          python3 scripts/coverage-diff.py --module-profile gen/go gen/go/cover.out --module-profile tools tools/cover.out --base "origin/$BASE_REF" --summary "$GITHUB_STEP_SUMMARY" > coverage.md
      - name: Coverage of the project
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 scripts/coverage-diff.py --module-profile gen/go gen/go/cover.out --module-profile tools tools/cover.out --summary "$GITHUB_STEP_SUMMARY"

      # One comment per PR, found by its marker and edited on every push. PRs from forks get a
      # read-only token, so they are skipped; a failed post never fails the build.
      - name: Coverage comment on the PR
        shell: bash # fail a lookup pipeline instead of creating a duplicate comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.coverage.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -s coverage.md || exit 0
          marker='<!-- coverage-report (ci.yml) -->'
          {
            echo "$marker"
            cat coverage.md
            echo
            echo "<sub>Commit ${HEAD_SHA::7} · [CI run]($RUN_URL) · информационный отчёт, AGENTS.md (Checks)</sub>"
          } > comment.md
          id=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            | jq -rs --arg m "$marker" \
              '[.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith($m)))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api "repos/${{ github.repository }}/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

  calc-fixtures:
    name: Calculation fixtures (reference calculation, schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - run: pip install 'pyyaml>=6,<7' 'openapi-schema-validator>=0.6,<0.7' 'rfc3339-validator>=0.1,<0.2'
      - name: Error presentation contract examples and schema boundaries
        run: python3 -m unittest discover -s scripts -p 'test_error_presentation.py'
      # The reference calculation against the examples of the calculation spec (docs/calc.md, section 9).
      - name: Reference calculation tests
        working-directory: tools/refcalc
        run: python3 -m unittest discover -s tests -t .
      # fixtures/calc/expected must equal a fresh run of the scenario, and every response must pass openapi.yaml.
      - name: Expected responses are up to date and valid
        working-directory: tools/refcalc
        run: python3 -m refcalc.scenario ../../fixtures/calc --check --openapi ../../openapi/openapi.yaml
