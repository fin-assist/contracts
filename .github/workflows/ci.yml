name: ci

on:
  push:
  pull_request:
    # labeled/unlabeled: the `breaking-accepted` label changes the oasdiff and check_error_spec_stable verdicts.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  BUF_VERSION: 1.47.2

jobs:
  openapi-lint:
    name: OpenAPI lint (Redocly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Config: redocly.yaml in the repo root.
      - run: npx --yes @redocly/cli@1 lint openapi/openapi.yaml

  openapi-breaking:
    name: OpenAPI breaking changes (oasdiff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: 'origin/${{ github.base_ref }}:openapi/openapi.yaml'
          revision: 'HEAD:openapi/openapi.yaml'
          # The owner accepts a breaking change of the alpha with the `breaking-accepted` label on that PR
          # (api.md, «Удаление устаревшего»): the changes are still listed, the job does not fail.
          fail-on: ${{ !contains(github.event.pull_request.labels.*.name, 'breaking-accepted') && 'ERR' || '' }}

  proto:
    name: Protobuf lint and breaking changes (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # buf lint on every run; buf breaking against the PR base on pull requests.
      # format/push are off: sources are kept as is, nothing is pushed to BSR (deps of proto/buf.lock are read from it).
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          input: proto
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: '${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto'
          push: false
          archive: false
          pr_comment: false

  error-registry:
    name: Error registry vs docs/api.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'protobuf>=5,<8'
      # The script expects descriptors (with imports) and the path to api.md.
      - name: Build descriptors
        working-directory: proto
        run: buf build -o "$RUNNER_TEMP/fd.binpb"
      - name: Check registry
        working-directory: proto
        run: python3 scripts/check_error_registry.py "$RUNNER_TEMP/fd.binpb" ../docs/api.md
      # error_spec of existing codes must not change (grpc-api.md 5.1, rule 5): buf breaking does not compare
      # custom options. The owner accepts a change with the `breaking-accepted` label.
      - name: Build base descriptors
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf build '${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto' -o "$RUNNER_TEMP/base.binpb"
      - name: error_spec of existing codes is unchanged
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: >-
          python3 scripts/check_error_spec_stable.py "$RUNNER_TEMP/base.binpb" "$RUNNER_TEMP/fd.binpb"
          ${{ contains(github.event.pull_request.labels.*.name, 'breaking-accepted') && '--accepted' || '' }}

  go-module:
    name: Go module gen/go (generation, build, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gen/go/go.mod
          cache-dependency-path: |
            tools/go.sum
            gen/go/go.sum
      # buf is pinned in tools/go.mod; BUF_VERSION above (buf-action) must be the same version.
      - name: buf version is the same in tools/go.mod and BUF_VERSION
        working-directory: tools
        run: test "$(go list -m -f '{{.Version}}' github.com/bufbuild/buf)" = "v${BUF_VERSION}"
      - name: Vet the generator
        working-directory: tools
        run: go vet ./...
      # gen/go must be exactly what proto/ generates with the pinned plugins.
      - name: Regenerate
        run: scripts/generate.sh
      - name: gen/go matches proto/
        run: |
          if [ -n "$(git status --porcelain -- gen/go)" ]; then
            git status --porcelain -- gen/go
            git diff -- gen/go | head -200
            echo "::error::gen/go is out of date: run scripts/generate.sh and commit the result"
            exit 1
          fi
      - name: Build, vet and test
        working-directory: gen/go
        run: |
          go build ./...
          go vet ./...
          go test ./...

  calc-fixtures:
    name: Calculation fixtures (reference calculation, schema)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'pyyaml>=6,<7' 'openapi-schema-validator>=0.6,<0.7' 'rfc3339-validator>=0.1,<0.2'
      # The reference calculation against the examples of the calculation spec (docs/calc.md, section 9).
      - name: Reference calculation tests
        working-directory: tools/refcalc
        run: python3 -m unittest discover -s tests -t .
      # fixtures/calc/expected must equal a fresh run of the scenario, and every response must pass openapi.yaml.
      - name: Expected responses are up to date and valid
        working-directory: tools/refcalc
        run: python3 -m refcalc.scenario ../../fixtures/calc --check --openapi ../../openapi/openapi.yaml
