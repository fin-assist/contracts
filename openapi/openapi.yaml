openapi: 3.0.3
info:
  title: Понятные финансы — клиентский API
  version: 1.0.0-mvp
  description: |
    Клиентский API приложения «Понятные финансы» (MVP). Источник правды по смыслу полей — `api.md` в проекте;
    этот файл — машиночитаемый контракт для кодогенерации, валидации (kin-openapi) и контроля
    несовместимых изменений (oasdiff в CI).

    **Транспорт:** HTTP/2 REST + SSE. Версия — в пути (`/v1`).

    **Соглашения:**
    - Моменты времени — `date-time` с часовым поясом. Диапазоны — полуинтервал `[from, to)`.
    - Календарные единицы считаются в часовом поясе профиля; исключение — сброс лимита помощника по Москве.
    - Деньги — целые копейки (`int64`). Сумма операции ≥ 0, суммы аналитики и помощника — со знаком.
    - ID — непрозрачные строки (сейчас UUIDv7); клиент их не разбирает и не конструирует.
    - В ответах поле, которого нет в `required`, может отсутствовать; если у него `nullable`, может прийти и
      `null` — клиент обрабатывает оба случая одинаково. В запросах необязательное поле просто не передаётся
      (`null` не отправляется).
    - **Закрытые наборы** — `enum`: новое значение = несовместимое изменение.
      **Открытые наборы** — `string` с `x-extensible-enum`: известные значения перечислены, новое значение
      совместимо, клиент обязан обработать неизвестное (поведение указано в описании поля).
      Генераторы не делают из `x-extensible-enum` закрытый тип — неизвестное значение не роняет разбор.
    - Полиморфные объекты (блок ответа помощника, чип) — плоские объекты с полем-типом, без `oneOf` и
      дискриминатора: неизвестный тип разбирается и обрабатывается по правилу поля.
    - Все ответы — объекты. Неизвестные поля клиент игнорирует.

    **Заголовки:** `X-Request-Id` (клиент генерирует на каждую попытку, сервер возвращает эхом во всех ответах);
    `Idempotency-Key` — на POST с побочным эффектом (у операции указан как обязательный параметр);
    `Retry-After` — у 429 и 409 `REQUEST_IN_PROGRESS`.

    **Ошибки:** всегда один объект `error` (см. `ErrorResponse`). Порядок проверки:
    401 → 429 → 400 → 409 → 404 → 403 → 413/422.

    **SSE:** первым событием — текущее состояние целиком; после терминального события поток закрывается;
    heartbeat `: ping` каждые 15 с; ошибки до начала потока — обычный HTTP-ответ с JSON. Неизвестный тип
    события клиент игнорирует. События потока описаны расширением `x-sse-events` (имя события → схема `data`).
    Веб-клиент читает поток через `fetch`, не `EventSource` (нужны заголовки).

    **Кодогенерация:** для SSE-операций (`streamPhoneVerification`, `streamStatementProgress`, `streamAnswer`)
    генерируются только модели событий; сам поток клиент читает вручную (OkHttp SSE, `URLSession` bytes, `fetch`) —
    сгенерированные клиенты читают тело целиком и блокируются до конца потока. На сервере эти маршруты
    исключаются из валидации ответов kin-openapi (у неё нет декодера `text/event-stream`).

    **Правила правки этого файла:** примитивные схемы (`Money`, `Month`, `PeriodKey`, открытые коды) в полях с
    собственным описанием записываются целиком, без обёртки `allOf` — часть генераторов её не переносит;
    необязательный объект-ссылка, который может быть `null`, — `type` + `nullable: true` + `allOf: [$ref]`
    (без `type` по OAS 3.0.3 `null` не допускается). Новый `POST` с побочным эффектом обязан требовать
    `Idempotency-Key`. Несовместимые изменения ловит oasdiff в CI.
servers:
- url: https://api.example.ru
  description: Продакшн (адрес — заглушка, заменить)
security:
- bearerAuth: []
tags:
- name: auth
  description: Вход по номеру телефона и обратному звонку
- name: profile
  description: Профиль, настройки, согласия
- name: statements
  description: Загрузка и история выписок
- name: operations
  description: Лента, поиск и правка операций
- name: categories
  description: Справочник категорий
- name: analytics
  description: Экран «Аналитика»
- name: assistant
  description: Помощник (Alice AI)
paths:
  /v1/auth/phone:
    post:
      tags:
      - auth
      operationId: startPhoneVerification
      summary: Начать верификацию телефона
      description: |
        Создаёт заявку на подтверждение номера обратным звонком. До подтверждения API не сообщает,
        зарегистрирован ли номер. Повтор с тем же `Idempotency-Key` возвращает ту же заявку и не расходует
        лимит верификаций.
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPhoneVerificationRequest'
            example:
              phone: '+79001234567'
      responses:
        '200':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneVerification'
              example:
                verification_token: vt_9mQ2x7LpR4aZ8cN1kT6wY3eB5uH0jV2sD4fG7hK9lP1
                callback_number: '+78001234567'
                expires_at: '2026-10-04T22:17:00+03:00'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/phone/events:
    get:
      tags:
      - auth
      operationId: streamPhoneVerification
      summary: Статус верификации (SSE)
      description: |
        Поток статуса заявки. Клиент открывает его после `ACTION_DIAL` и переоткрывает при возврате из фона.
        Первое событие — текущий статус. Результат `verified` доступен до `expires_at`: переподключение с тем
        же токеном отдаёт те же токены. Заявка закрывается первым `/v1/auth/token` с выданным refresh или
        `/v1/auth/register`; после этого и после `expires_at` — 401 `INVALID_TOKEN`.

        Терминальные события: `status` с `verified` или `expired`.
      security:
      - verificationToken: []
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE-поток. События: `status` → `PhoneVerificationStatusEvent`, `error` → `SseError`.'
              example: |
                event: status
                data: {"status": "pending"}

                event: status
                data: {"status": "verified", "is_new_user": true, "registration_token": "reg_..."}
          x-sse-events:
            status:
              $ref: '#/components/schemas/PhoneVerificationStatusEvent'
            error:
              $ref: '#/components/schemas/SseError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/register:
    post:
      tags:
      - auth
      operationId: register
      summary: Регистрация нового пользователя
      description: |
        Вызывается с экрана согласия на обработку ПДн после подтверждения нового номера.
        `registration_token` расходуется только ответом `201`; после ошибки 4xx его можно отправить снова
        (с новым `Idempotency-Key`, если тело изменилось). Повтор с тем же ключом возвращает тот же `201`.
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              registration_token: reg_...
              pd_consent_accepted: true
              pd_consent_version: '2026-09-28'
              timezone: Europe/Moscow
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                access_token: eyJ...
                refresh_token: rt_...
                user_id: 01a107db-ae80-7b07-b8a1-a8c8486e2532
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/token:
    post:
      tags:
      - auth
      operationId: refreshTokens
      summary: Обновить токены
      description: |
        Ротация refresh-токена. Повторное использование старого refresh отзывает всю цепочку сессии —
        кроме повтора с тем же `Idempotency-Key` в течение 60 секунд: тогда возвращается та же новая пара.
      security: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJ...
                refresh_token: rt_new_...
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: Выход
      description: Завершает сессию. Повтор возвращает `204`.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Сессия завершена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/consents/{type}:
    get:
      tags:
      - auth
      - profile
      operationId: getConsentDocument
      summary: Текущая версия документа согласия
      description: |
        `personal_data` — без токена (экран согласия до регистрации); `assistant` — с токеном.
        Клиент не зашивает версию: после `CONSENT_OUTDATED` запрашивает документ заново.
      security:
      - {}
      - bearerAuth: []
      parameters:
      - name: type
        in: path
        required: true
        description: 'Тип документа: `personal_data`, `assistant`. Неизвестный тип — 404.'
        schema:
          type: string
          x-extensible-enum:
          - personal_data
          - assistant
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Документ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentDocument'
              example:
                type: personal_data
                version: '2026-09-28'
                title: Согласие на обработку персональных данных
                url: https://example.ru/legal/pd-consent/2026-09-28
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/profile:
    get:
      tags:
      - profile
      operationId: getProfile
      summary: Профиль
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
              example:
                user_id: 01a107db-ae80-7b07-b8a1-a8c8486e2532
                phone: '+79161234567'
                theme: system
                timezone: Europe/Moscow
                consents:
                - type: assistant
                  granted: false
                  current_version: '2026-09-28'
                created_at: '2026-10-04T20:00:00+03:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - profile
      operationId: updateProfile
      summary: Обновить настройки
      description: |
        Любое подмножество полей. Смена `timezone` запускает фоновый пересчёт помесячной аналитики;
        пока он идёт, `/v1/analytics` отдаёт `state.recalculating: true`.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
            example:
              theme: dark
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - profile
      operationId: deleteAccount
      summary: Удалить аккаунт
      description: |
        Клиент подтверждает действие код-паролем или биометрией локально, затем вызывает. Сервер удаляет все
        данные во всех сервисах, включая файлы выписок. Повтор после успешного удаления — тоже `204`.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: Аккаунт удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/profile/assistant-consent:
    put:
      tags:
      - profile
      operationId: grantAssistantConsent
      summary: Дать согласие помощнику
      description: Только с экрана согласия после галочки. Повтор с той же версией ничего не меняет.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantConsentGrant'
            example:
              version: '2026-09-28'
      responses:
        '200':
          description: Профиль с действующим согласием
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - profile
      operationId: revokeAssistantConsent
      summary: Отозвать согласие помощнику
      description: Переключатель в профиле, без диалога. Повтор — тоже `204`. История ответов остаётся.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: Согласие отозвано
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/statements/config:
    get:
      tags:
      - statements
      operationId: getImportConfig
      summary: Конфигурация импорта
      description: Для экрана «Загрузка выписки».
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Конфигурация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportConfig'
              example:
                download_url: https://www.tbank-online.com/...
                login_url: https://www.tbank.ru/login/
                max_file_size_bytes: 10485760
                accepted_formats:
                - OFX
                suggested_period:
                  from: '2025-10-04T00:00:00+03:00'
                  to: '2026-10-05T00:00:00+03:00'
                loaded:
                  first_operation_at: '2026-09-01T08:15:00+03:00'
                  last_operation_at: '2026-09-25T21:40:00+03:00'
                  operation_count: 181
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/statements:
    get:
      tags:
      - statements
      operationId: listStatements
      summary: История загрузок
      description: Для «Истории загрузок» и строки «Выписка» в профиле.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Загрузки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementsList'
              example:
                summary:
                  upload_count: 3
                  operation_count: 1086
                  first_operation_at: '2026-04-01T09:12:00+03:00'
                  last_operation_at: '2026-09-25T21:40:00+03:00'
                  gaps:
                  - from: '2026-07-11T00:00:00+03:00'
                    to: '2026-07-20T00:00:00+03:00'
                uploads:
                - upload_id: 01a10812-9d00-77d9-8c3d-b350e0119cd5
                  file_name: operations_2026.ofx
                  status: done
                  uploaded_at: '2026-09-25T21:50:00+03:00'
                  operation_count: 1086
                  unread_count: 0
                  first_operation_at: '2026-04-01T09:12:00+03:00'
                  last_operation_at: '2026-09-25T21:40:00+03:00'
                  source_name: Выписка Т-Банка
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - statements
      operationId: uploadStatement
      summary: Загрузить выписку
      description: |
        Синхронно, до `202`, проверяется видимое без разбора: размер, формат по содержимому, банк по заголовку
        OFX. Ошибки — обычным HTTP-ответом, загрузка не создаётся: `FILE_TOO_LARGE` (413), `CSV_NOT_ACCEPTED`,
        `WRONG_FORMAT`, `WRONG_BANK` (422). Ошибки разбора операций — событием `error` в потоке прогресса.
        Повтор с тем же `Idempotency-Key` возвращает ту же загрузку.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XRequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: OFX-файл до `max_file_size_bytes`. Имя файла из `Content-Disposition` сохраняется и показывается
                    в «Истории загрузок».
            encoding:
              file:
                contentType: application/x-ofx, application/octet-stream
      responses:
        '202':
          description: Файл принят, разбор запущен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAccepted'
              example:
                upload_id: 01a10812-9d00-77d9-8c3d-b350e0119cd5
                file_name: operations_2026.ofx
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/statements/{upload_id}:
    delete:
      tags:
      - statements
      operationId: deleteStatement
      summary: Удалить загрузку или прервать разбор
      description: |
        `done` — удаляет операции, которых нет в других загрузках, и файл; ручные правки категорий у оставшихся
        операций сохраняются; аналитика пересчитывается асинхронно. `processing` — разбор прерывается, ничего не
        сохраняется, поток прогресса завершается событием `error` с кодом `CANCELLED`.
        Повтор для уже удалённой загрузки — `204`; `404` — только если такой загрузки никогда не было.
      parameters:
      - $ref: '#/components/parameters/UploadId'
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '204':
          description: Удалено
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/statements/{upload_id}/progress:
    get:
      tags:
      - statements
      operationId: streamStatementProgress
      summary: Прогресс обработки (SSE)
      description: |
        Первое событие — текущее состояние: `progress`, а если разбор уже закончен — сразу `complete` или `error`.
        Терминальные события: `complete`, `error` (`PROCESSING_FAILED`, `CANCELLED`; неизвестный код — общая
        ошибка разбора). Импорт атомарный: при ошибке ни одна операция не сохранена, файл удалён.
      parameters:
      - $ref: '#/components/parameters/UploadId'
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE-поток. События: `progress` → `ImportProgressEvent`, `complete` → `ImportResult`, `error`
                  → `StreamError`.'
              example: |
                event: progress
                data: {"stage": "parsing", "percent": 20}

                event: error
                data: {"code": "PROCESSING_FAILED", "message": "..."}
          x-sse-events:
            progress:
              $ref: '#/components/schemas/ImportProgressEvent'
            complete:
              $ref: '#/components/schemas/ImportResult'
            error:
              $ref: '#/components/schemas/StreamError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/statements/unread-lines:
    get:
      tags:
      - statements
      operationId: listUnreadLines
      summary: Непрочитанные строки
      description: |
        Шторка «Непрочитанные строки»: по загрузке (`upload_id`) или по периоду (`from` + `to`) — ровно одно из
        двух, иначе 400 `VALIDATION_ERROR`. Содержимого строк нет — оно не хранится.

        «Сообщить нам» эндпоинта не имеет: клиент открывает `mailto:` на адрес поддержки с `user_id`,
        `upload_id`, `file_name`, номерами строк и `reason`.
      parameters:
      - name: upload_id
        in: query
        description: Строки одной загрузки.
        schema:
          type: string
      - name: from
        in: query
        description: Начало периода; строки, разобранная дата которых попадает в период. Строки без даты сюда не попадают.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Конец периода (исключительно).
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Строки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadLinesList'
              example:
                lines:
                - upload_id: 01a10812-9d00-77d9-8c3d-b350e0119cd5
                  file_name: operations_2026.ofx
                  line_number: 412
                  date: '2026-09-03T00:00:00+03:00'
                  reason: bad_amount
                  reason_name: не распознали сумму
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/operations:
    get:
      tags:
      - operations
      operationId: listOperations
      summary: Лента и поиск операций
      description: |
        **Лента** — без фильтров: порции по 3 календарных месяца, новые первыми; следующая порция — с `before`
        из `next_before`. **Поиск** — передан хотя бы один фильтр: вся выборка одним ответом (до 10 000 операций,
        больше — 422 `TOO_MANY_RESULTS`). Без периода и без `all_time` поиск идёт за последние 12 месяцев.
        `before` вместе с фильтрами, `all_time` вместе с `from`/`to` — 400.
      parameters:
      - name: from
        in: query
        description: Начало периода (включительно). Можно передать одну границу.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Конец периода (исключительно).
        schema:
          type: string
          format: date-time
      - name: all_time
        in: query
        description: Искать за всё время, без периода по умолчанию. Вместе с `from`/`to` — 400.
        schema:
          type: boolean
      - name: q
        in: query
        description: |
          Текст из строки поиска, условия через «или»: подстрока в описании; название итоговой категории или
          категории банка; точная сумма, если `q` — число («1520», «1 520», «1520,50»); последние 4 цифры счёта.
          Без учёта регистра, «ё» = «е». Набор полей расширяемый.
        schema:
          type: string
      - name: category_id
        in: query
        description: |
          Категория. Без `transfer_mode` — итоговая категория операции. С `transfer_mode` — категория в
          аналитике: в выборку входят и возвраты, которые эту категорию уменьшили.
        schema:
          type: string
      - name: kind
        in: query
        description: |
          `expense` — только расходы, `income` — только доходы. Переводы между своими счетами не входят ни в
          один. С `transfer_mode` возвраты относятся к расходам. Открытый код (FIN-82): клиент передаёт и значение,
          которого сам не знает, если получил его в `operations_filter`; неизвестное серверу — 400.
        schema:
          $ref: '#/components/schemas/OperationKindCode'
      - name: amount_from
        in: query
        description: Сумма операции не меньше, копейки.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: amount_to
        in: query
        description: Сумма операции не больше, копейки.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: transfer_mode
        in: query
        description: |
          Выборка по правилам «Аналитики»: `with` — без «Между своими счетами»; `without` — ещё и без переводов.
          Неизвестное значение сервер отклоняет 400.
        schema:
          $ref: '#/components/schemas/TransferMode'
      - name: selection
        in: query
        description: |
          Непрозрачная выборка из `OperationsFilter` (карточка «Аналитики», продавец из ответа помощника,
          операции без категории). Клиент её не конструирует. Периода не содержит, действует бессрочно.
          Недействительная — 422 `SELECTION_NOT_FOUND`, клиент открывает Поиск без неё.
        schema:
          type: string
      - name: before
        in: query
        description: Только в ленте — вернуть 3 месяца до этого момента. Вместе с фильтрами — 400.
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Порция ленты или результаты поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsList'
              examples:
                feed:
                  summary: Лента
                  value:
                    items:
                    - id: 01a10812-a0e8-765b-89e4-a4314a43656f
                      kind: expense
                      occurred_at: '2026-09-25T19:11:00+03:00'
                      amount: 234000
                      currency: RUB
                      title: Пятёрочка
                      category_id: cat_supermarkets
                      category_name: Супермаркеты
                      category_icon: cart
                      is_category_manual: false
                      note: null
                      account:
                        type_name: Текущий
                        mask: ··4821
                      status: posted
                    - id: 01a10812-a0e9-7c41-8d2a-5f0e3b7c9a12
                      kind: own_transfer
                      occurred_at: '2026-09-18T09:30:00+03:00'
                      amount: 2000000
                      currency: RUB
                      title: Перевод между счетами
                      category_id: cat_own_transfer
                      category_name: Между своими счетами
                      category_icon: transfer
                      is_category_manual: false
                      note: не в тратах
                      from_account:
                        type_name: Накопительный
                        mask: ··0734
                      to_account:
                        type_name: Текущий
                        mask: ··4821
                      status: posted
                    summary:
                    - month: '2026-09'
                      range:
                        from: '2026-09-01T00:00:00+03:00'
                        to: '2026-10-01T00:00:00+03:00'
                      expense: 8432000
                      income: 15690000
                      data_to: '2026-09-25T21:40:00+03:00'
                    state:
                      stale: false
                      last_operation_at: '2026-09-25T21:40:00+03:00'
                      last_uploaded_at: '2026-09-25T21:50:00+03:00'
                    range:
                      from: '2026-08-01T00:00:00+03:00'
                      to: '2026-11-01T00:00:00+03:00'
                    next_before: '2026-08-01T00:00:00+03:00'
                search:
                  summary: Поиск (сокращено до одной записи)
                  value:
                    items:
                    - id: 01a10812-a0f1-7b3c-9e2d-4a6f8c1e3b57
                      kind: expense
