            `to` — начало завтрашнего дня.
        loaded:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/LoadedSummary'
          description: Что уже загружено. Нет — загрузок ещё не было (первая загрузка, «Загружу позже»).
          type: object
    LoadedSummary:
      type: object
      required:
      - first_operation_at
      - last_operation_at
      - operation_count
      properties:
        first_operation_at:
          type: string
          format: date-time
        last_operation_at:
          type: string
          format: date-time
        operation_count:
          type: integer
          description: Операций всего.
    UploadAccepted:
      type: object
      required:
      - upload_id
      - file_name
      properties:
        upload_id:
          type: string
          description: ID загрузки — для прогресса, отмены и удаления.
        file_name:
          type: string
    ImportProgressEvent:
      type: object
      description: Событие `progress`.
      required:
