        uncategorized_count:
          type: integer
          description: Без категории; входят в суммы.
        uncategorized_filters:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OperationsFilter'
          description: Выборка для ссылки «разобрать».
          type: object
        coverage:
          $ref: '#/components/schemas/ImportCoverage'
        currency:
          type: string
          description: Валюта всех сумм события (ISO 4217); сейчас всегда `RUB`.
          example: RUB
        notices:
          type: array
          description: Особые ситуации (FIN-82 — объекты с текстом).
          items:
            $ref: '#/components/schemas/ImportNotice'
    ImportNotice:
      type: object
