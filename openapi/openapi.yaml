          description: '`parsing`, `dedup`, `rules`. Для логов и отладки; клиент показывает только `percent`.'
          x-extensible-enum:
          - parsing
          - dedup
          - rules
        percent:
          type: integer
          minimum: 0
          maximum: 100
    ImportResult:
      type: object
