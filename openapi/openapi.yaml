      - features
      properties:
        full_months:
          type: integer
          description: Полных месяцев по всем загрузкам после этой.
        full_months_before:
          type: integer
          description: Полных месяцев до этой загрузки.
        newly_full_months:
          type: array
          description: Месяцы, ставшие полными с этой загрузкой.
          items:
