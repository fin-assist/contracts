        Блок общего каталога (api.md «Блоки», FIN-4): экран «Аналитика» (6.1) и ответ помощника (7.2). Оболочка общая,
        содержимое — в `data` по схеме примитива `type` версии `v`: `heading` — `HeadingData`, `text` — `TextData`,
        `rows` — `RowsData`, `chart` — `ChartData`, `tile_group` — `TileGroupData`, `ranked_list` — `RankedListData`,
        `insight_card` — `InsightCardData`. Неизвестный `type` или `v` клиент не рисует: показывает `alt_text`, если он
        есть, иначе пропускает блок. Блок, который не удалось разобрать, пропускается, остальной экран показывается.
      required:
      - type
      - v
      properties:
        id:
          type: string
          nullable: true
          description: Только в 6.1 — стабильный id блока; выключатель Remote Config `analytics.block.<id>`, события показа.
        type:
          type: string
          x-extensible-enum:
          - heading
          - text
          - rows
          - chart
          - tile_group
          - ranked_list
          - insight_card
        v:
          type: integer
          minimum: 1
          description: Версия схемы `data` для этого типа.
        status:
          $ref: '#/components/schemas/BlockStatus'
        lock:
          $ref: '#/components/schemas/BlockLock'
        title:
          type: string
          nullable: true
        alt_text:
          type: string
          nullable: true
          description: Текстовая версия для TalkBack и для клиента, который тип не знает. Есть у всех, кроме `text` и `heading`.
        empty_text:
          type: string
          nullable: true
          description: Текст при `none` и `unavailable`.
        data:
          type: object
          nullable: true
          additionalProperties: true
          description: Содержимое примитива (схемы `*Data`); есть при `ready` и `tentative`, у `tile_group` и `insight_card` — всегда.
        action:
          $ref: '#/components/schemas/BlockAction'
    BlockStatus:
      type: string
      nullable: true
      description: |
        `ready` (нет поля — тоже) — посчитано; `tentative` — предварительно, данных мало; `locked` — пока не считаем,
        причина в `lock`; `none` — проверили, ничего нет; `unavailable` — не удалось посчитать, остальной экран
        показывается. Неизвестное — как `locked`.
      x-extensible-enum:
      - ready
      - tentative
      - locked
      - none
      - unavailable
    BlockLock:
      type: object
      nullable: true
      description: Только при `locked`.
      required:
      - reason
      - text
      properties:
        reason:
          type: string
          description: Для статистики и иконки. Неизвестное — блокировка без подробностей.
          x-extensible-enum:
          - need_full_months
          - need_months_with_data
          - too_early_in_month
          - stale_data
        text:
          type: string
          description: Готовый текст блокировки («Нужно 3 полных месяца, есть 1»); клиент показывает как есть.
        required:
          type: integer
          nullable: true
        available:
          type: integer
          nullable: true
        available_from:
          type: string
          format: date-time
          nullable: true
    BlockAction:
      type: object
      nullable: true
      description: |
        Действие из фиксированного словаря: `open_operations` — Поиск с `filter`; `open_assistant` — чат помощника;
        `dismiss_regular_payment` — кнопка `label` у строки платежа (6.3 с `payment_id`). Неизвестное — элемент не
        нажимается.
      required:
      - type
      properties:
        type:
          type: string
          x-extensible-enum:
          - open_operations
          - open_assistant
          - dismiss_regular_payment
        filter:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OperationsFilter'
          type: object
        payment_id:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
    ValueKind:
      type: string
      description: |
        Что за число в паре `value` + `value_kind`: `amount` — сумма в минимальных единицах валюты ответа, со знаком;
        `percent` — доля 0–1; `count` — количество. Неизвестное — значение не показывается.
      x-extensible-enum:
      - amount
      - percent
      - count
    HeadingData:
      type: object
      description: '`heading` v1 — заголовок раздела.'
      required:
      - text
      properties:
        text:
          type: string
    TextData:
      type: object
      description: '`text` v1 — текст в подмножестве Markdown (абзацы, `**жирный**`, список `- `).'
      required:
      - text
      properties:
        text:
          type: string
    RowsData:
      type: object
      description: '`rows` v1 — строки «подпись — значение». Строку без значения и текста клиент пропускает.'
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/BlockRow'
    BlockRow:
      type: object
      required:
      - label
      properties:
        label:
          type: string
        sublabel:
          type: string
          nullable: true
        value:
          type: number
          format: double
          nullable: true
        value_kind:
          $ref: '#/components/schemas/ValueKind'
        text:
          type: string
          nullable: true
        action:
          $ref: '#/components/schemas/BlockAction'
    ChartData:
      type: object
      description: '`chart` v1 — столбцы по периодам, с итогом и строками под графиком.'
      required:
      - kind
      - value_kind
      - points
      properties:
        kind:
          type: string
          description: '`bar` — столбцы. Неизвестный — показать `alt_text`.'
          x-extensible-enum:
          - bar
        value_kind:
          $ref: '#/components/schemas/ValueKind'
        points:
          type: array
          description: Точки, старые первыми; может быть пустым (только итог).
          items:
            $ref: '#/components/schemas/ChartPoint'
        highlight_index:
          type: integer
          nullable: true
          minimum: 0
        show_values:
          type: boolean
          nullable: true
        summary:
          $ref: '#/components/schemas/BlockValue'
        caption:
          type: string
          nullable: true
        notes:
          type: array
          nullable: true
          items:
            type: object
            required:
            - text
            properties:
              text:
                type: string
              tone:
                type: string
                description: '`primary` или `muted`; неизвестное — `muted`.'
                x-extensible-enum:
                - primary
                - muted
    ChartPoint:
      type: object
      required:
      - range
      - coverage
      properties:
        range:
          allOf:
          - $ref: '#/components/schemas/Range'
          description: Период точки; подпись оси клиент формирует из него.
        value:
          type: number
          format: double
          nullable: true
          description: Значение по `value_kind`; нет — за период нет данных (пустой столбец, не ноль).
        coverage:
          $ref: '#/components/schemas/Coverage'
        data_from:
          type: string
          format: date-time
          nullable: true
        data_to:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
          description: Подпись неполного столбца («по 25-е»).
    BlockValue:
      type: object
      nullable: true
      required:
      - value
      - value_kind
      properties:
        label:
          type: string
          nullable: true
        value:
          type: number
          format: double
        value_kind:
          $ref: '#/components/schemas/ValueKind'
        action:
          $ref: '#/components/schemas/BlockAction'
    TileGroupData:
      type: object
      description: '`tile_group` v1 — плитки по две в ряд, по порядку.'
      required:
      - tiles
      properties:
        tiles:
          type: array
          items:
            $ref: '#/components/schemas/Tile'
    Tile:
      type: object
      required:
      - id
      - title
      properties:
        id:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/BlockStatus'
        lock:
          $ref: '#/components/schemas/BlockLock'
        value:
          type: number
          format: double
          nullable: true
        value_kind:
          $ref: '#/components/schemas/ValueKind'
        approx:
          type: boolean
          nullable: true
        show_plus:
          type: boolean
          nullable: true
        caption:
          type: string
          nullable: true
        action:
          $ref: '#/components/schemas/BlockAction'
    RankedListData:
      type: object
      description: '`ranked_list` v1 — список по убыванию с полосами.'
      required:
      - items
      properties:
        total:
          $ref: '#/components/schemas/BlockValue'
        items:
          type: array
          items:
            $ref: '#/components/schemas/RankedItem'
        visible_count:
          type: integer
          nullable: true
          minimum: 1
        more_label:
          type: string
          nullable: true
        empty_text:
          type: string
          nullable: true
        style:
          type: string
          nullable: true
          description: '`bars` (по умолчанию) — полосы и доли; `plain` — строки без полос. Неизвестное — `bars`.'
          x-extensible-enum:
          - bars
          - plain
    RankedItem:
      type: object
      required:
      - icon
      - title
      - value
      - value_kind
      properties:
        id:
          type: string
          nullable: true
        icon:
          type: string
        title:
          type: string
        note:
          type: string
          nullable: true
        value:
          type: number
          format: double
        value_kind:
          $ref: '#/components/schemas/ValueKind'
        share:
          type: number
          format: double
          nullable: true
        show_plus:
          type: boolean
          nullable: true
        action:
          $ref: '#/components/schemas/BlockAction'
    InsightCardData:
      type: object
      description: '`insight_card` v1 — карточка-наблюдение.'
      required:
      - icon
      - title
      properties:
        icon:
          type: string
        title:
          type: string
        badge:
          type: string
          nullable: true
        value:
          type: number
          format: double
          nullable: true
        value_kind:
          $ref: '#/components/schemas/ValueKind'
        approx:
          type: boolean
          nullable: true
        description:
          type: string
          nullable: true
        items:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/InsightItem'
        items_more:
          $ref: '#/components/schemas/BlockValue'
    InsightItem:
      type: object
      required:
      - title
      properties:
        title:
          type: string
        sublabel:
          type: string
          nullable: true
        value:
          type: number
          format: double
          nullable: true
        value_kind:
          $ref: '#/components/schemas/ValueKind'
        value_suffix:
          type: string
          nullable: true
          description: Приписка к значению («в месяц»).
        muted:
          type: boolean
          nullable: true
        action:
          $ref: '#/components/schemas/BlockAction'
    Chip:
      type: object
      description: Чип-переход под ответом (и событие `chip`). Неизвестный `screen` — чип не показывать.
      required:
      - label
      - screen
      properties:
        label:
          type: string
        screen:
          type: string
          description: '`operations` — Поиск с `filters`; `analytics` — «Аналитика» с `params`.'
          x-extensible-enum:
          - operations
          - analytics
        filters:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/OperationsFilter'
          description: Для `operations`; всегда с `transfer_mode` ответа.
          type: object
        params:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AnalyticsParams'
          description: Для `analytics`.
          type: object
    AnswerSource:
      type: object
      description: Строка источника под ответом (и событие `source`).
      required:
      - calculated_at
      - transfer_mode
      - changed_since
      - changed_since_text
      properties:
        calculated_at:
          type: string
          format: date-time
        data_range:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Range'
          type: object
        transfer_mode:
          $ref: '#/components/schemas/TransferMode'
        changed_since:
          type: array
          description: |
            Что изменилось после расчёта: `categories` — «с тех пор категории менялись»; `uploads` — загружали или
            удаляли выписки. Пустой — ничего. Неизвестное — общий текст «с тех пор данные менялись».
          items:
            type: string
            x-extensible-enum:
            - categories
            - uploads
        changed_since_text:
          type: string
          nullable: true
          description: |
            Готовый текст о том же («с тех пор категории менялись»); нет — ничего не менялось. Для неизвестного кода
            клиент показывает его (FIN-82).
    AnswerSnapshotEvent:
      type: object
      description: Событие `snapshot` — всегда первое; клиент заменяет им показанное.
      required:
      - status
      - blocks
      - chips
      - currency
      properties:
        currency:
          type: string
          description: Валюта всех сумм в блоках ответа (ISO 4217); сейчас всегда `RUB`.
        status:
          type: string
          description: Как `Message.status`. Неизвестное — как `failed`.
          x-extensible-enum:
          - generating
          - complete
          - failed
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        chips:
          type: array
          items:
            $ref: '#/components/schemas/Chip'
        source:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AnswerSource'
          type: object
    AnswerChunkEvent:
      type: object
      description: Событие `chunk` — фрагмент текстового блока.
      required:
      - index
      - text
      properties:
        index:
          type: integer
          minimum: 0
          description: Номер текстового блока. Равен числу полученных блоков — начинается новый; меньше — дописать в существующий.
        text:
          type: string
    AnswerBlockEvent:
      type: object
      description: Событие `block` — готовый нетекстовый блок целиком.
      required:
      - index
      - block
      properties:
        index:
          type: integer
          minimum: 0
          description: Номер блока; всегда следующий по порядку.
        block:
          $ref: '#/components/schemas/Block'
    AnswerDoneEvent:
      type: object
      description: Терминальное событие `done` — ответ готов и сохранён.
      required:
      - charged
      - remaining_limit
      properties:
        charged:
          type: boolean
          description: '`false` — данных для полного ответа не хватило (по результатам функций), попытка не списана.'
        remaining_limit:
          type: integer
    AnswerErrorEvent:
      type: object
      description: |
        Терминальное событие `error`. `MODEL_ERROR` — сбой или таймаут («Повторить» → `retryAnswer`);
        `CANNOT_ANSWER` — нельзя ответить по данным, без «Повторить». Неизвестный код — как `MODEL_ERROR`.
        Попытка возвращена.
      required:
      - code
      - message
      - remaining_limit
      properties:
        code:
          type: string
          x-extensible-enum:
          - MODEL_ERROR
          - CANNOT_ANSWER
        message:
          type: string
        remaining_limit:
          type: integer
