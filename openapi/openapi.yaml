                      transfer_mode: with
                  source:
                    calculated_at: '2026-09-25T19:11:00+03:00'
                    data_range:
                      from: '2026-04-01T00:00:00+03:00'
                      to: '2026-10-01T00:00:00+03:00'
                    transfer_mode: with
                    changed_since: []
                  created_at: '2026-10-04T22:10:05+03:00'
