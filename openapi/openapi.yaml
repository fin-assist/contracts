  /v1/analytics:
    get:
      tags:
      - analytics
      operationId: getAnalytics
      summary: Аналитика за период
      description: |
        Экран — упорядоченный список блоков общего каталога (FIN-4). Пороги, блокировки, базы расчёта, устаревание и
        тексты сервер вычисляет сам; клиент только рисует блоки. При `has_data: false` остальных полей нет.
      parameters:
      - name: period
        in: query
        description: |
          `month` (по умолчанию), `quarter`, `year`. Набор расширяемый (например, `week`) — новое значение
          появляется вместе с новым форматом `PeriodKey`; клиент запрашивает только известные ему значения.
        schema:
          type: string
          description: 'Тип периода: `month`, `quarter`, `year`. Открытый набор: клиент запрашивает только известные значения.'
          x-extensible-enum:
          - month
          - quarter
          - year
          default: month
      - name: date
        in: query
        description: |
          Период в поясе профиля. Может быть точнее `period`: `period=quarter&date=2026-09` — квартал, в который
          входит сентябрь; ответ содержит точный ключ (`2026-Q3`). Без параметра — последний период с данными.
        schema:
          $ref: '#/components/schemas/PeriodKey'
      - name: transfer_mode
        in: query
        description: '`with` (по умолчанию) или `without`. Неизвестное значение сервер отклоняет 400.'
        schema:
          type: string
          description: |
            Режим учёта переводов: `with` — с переводами, `without` — без переводов людям (входящих и исходящих).
            «Между своими счетами» исключается в обоих режимах. В запросах неизвестное значение сервер отклоняет 400;
            в ответах неизвестное значение клиент обрабатывает как `with`. Отсутствие поля в фильтре Поиска значит
            «без правил аналитики», а не `with`.
          x-extensible-enum:
          - with
          - without
          default: with
      - name: supports
        in: query
        description: |
          Примитивы, которые умеет рисовать клиент: `type@v` через запятую (`tile_group@1,chart@1`). Сервер отдаёт
          только совместимые блоки (при возможности — в поддерживаемой версии или более простым примитивом). Без
          параметра — версия 1 всех типов каталога.
        schema:
          type: string
          example: heading@1,text@1,rows@1,chart@1,tile_group@1,ranked_list@1,insight_card@1
      - name: exp
        in: query
        description: |
          Варианты экспериментов над составом экрана из RuStore Remote Config: `key:variant` через запятую
          (`analytics_order:b`). Неизвестный ключ или вариант сервер игнорирует (FIN-9).
        schema:
          type: string
      - $ref: '#/components/parameters/XRequestId'
      responses:
        '200':
          description: Аналитика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
              example:
                {
                  "has_data": true,
                  "params": {
                    "period": "month",
                    "date": "2026-09",
                    "transfer_mode": "with"
                  },
