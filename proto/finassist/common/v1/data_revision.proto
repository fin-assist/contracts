syntax = "proto3";

package finassist.common.v1;

option go_package = "github.com/fin-assist/contracts/gen/go/finassist/common/v1;commonv1";

// Ревизия одного вида исходных данных пользователя. Список этих записей описывает
// именно прочитанный снимок, а не время начала или завершения расчёта (FIN-367).
message DataRevision {
  // Открытый код: categories, uploads, time_zone. Неизвестный код сохраняется
  // промежуточным хранилищем; потребитель не приписывает ему известный смысл.
  string code = 1;
  // Монотонная ревизия на пользователя и code; 0 — известное начальное состояние.
  // Отсутствие записи означает неизвестную ревизию, а не 0. Хранится как bigint.
  int64 value = 2;
}
